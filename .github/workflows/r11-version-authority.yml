name: R11 Version Authority Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  r11-version-authority:
    name: R11 Version Authority Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate approved R11 identity and every local runtime asset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref || 'main' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const cp = require('child_process');
          const authority = JSON.parse(fs.readFileSync('VERSION-AUTHORITY.json', 'utf8'));
          const app = authority.app || {};
          function fail(message) {
            console.error('VERSION AUTHORITY BLOCKED: ' + message);
            process.exit(1);
          }
          const repository = 'Thehandymanjob/accountancy-r11-preview';
          const appPath = 'v273-isolated-test/r11-income-prefix-repair-20261114/index.html';
          const approvedBaseline = '6e335a7c84fdf4b372c9fe5d07276b6e40df9b88';
          if (authority.repository !== repository) fail('repository mismatch');
          if (authority.protectedBranch !== 'main') fail('target branch mismatch');
          if (app.path !== appPath) fail('approved app path mismatch');
          if (String(app.version || '') !== '273') fail('app version mismatch');
          const buildMatch = String(app.buildId || '').match(/^THA-273-R11-PREVIEW-\d{8}-R(\d+)$/);
          if (!buildMatch) fail('R11 Build ID is not an approved preview build');
          let canonicalUrl;
          try { canonicalUrl = new URL(app.canonicalUrl); } catch (_) { fail('canonical URL is invalid'); }
          if (canonicalUrl.origin !== 'https://thehandymanjob.github.io' || canonicalUrl.pathname !== '/accountancy-r11-preview/' + appPath.replace(/index\.html$/, '') || canonicalUrl.searchParams.get('build') !== 'R' + buildMatch[1]) fail('canonical URL does not match approved Build ID and app path');
          for (const key of canonicalUrl.searchParams.keys()) if (!['build','utm_source'].includes(key)) fail('unexpected canonical URL parameter: ' + key);
          if (canonicalUrl.searchParams.has('utm_source') && canonicalUrl.searchParams.get('utm_source') !== 'chatgpt.com') fail('unexpected canonical URL source');
          if (app.approvedBaseCommitSha !== approvedBaseline) fail('approved R11 baseline mismatch');
          if (!app.files || typeof app.files !== 'object' || Object.keys(app.files).length !== 24) fail('runtime asset pin list must contain exactly 22 files');
          if (app.files[appPath] !== app.indexBlobSha) fail('index blob SHA does not match runtime asset pin');
          if (process.env.EVENT_NAME === 'pull_request' && process.env.PR_BASE !== 'main') fail('PR base is not main');
          if (process.env.EVENT_NAME === 'push' && process.env.REF_NAME !== 'main') fail('push target is not main');
          try {
            cp.execFileSync('git', ['merge-base','--is-ancestor',approvedBaseline,process.env.BASE_SHA], {stdio:'ignore'});
          } catch (_) {
            fail('base commit is not descended from approved R11 baseline');
          }
          const blobSha = (path) => {
            const body = fs.readFileSync(path);
            return crypto.createHash('sha1').update(Buffer.from('blob ' + body.length + '\0')).update(body).digest('hex');
          };
          const html = fs.readFileSync(appPath, 'utf8');
          const version = html.match(/<meta name="app-version" content="([^"]+)"/);
          const build = html.match(/<meta name="app-build-id" content="([^"]+)"/);
          const canonical = html.match(/const R11_CANONICAL_PAGE_URL = Object\.freeze\('([^']+)'\)/);
          if (!version || version[1] !== app.version) fail('HTML app-version mismatch');
          if (!build || build[1] !== app.buildId) fail('HTML Build ID mismatch');
          if (!canonical || canonical[1] !== app.canonicalUrl) fail('canonical R11 URL mismatch');
          for (const [path,sha] of Object.entries(app.files)) {
            if (!/^[0-9a-f]{40}$/.test(String(sha))) fail('invalid pinned SHA: ' + path);
            if (!fs.existsSync(path)) fail('required runtime file missing: ' + path);
            const actual = blobSha(path);
            if (actual !== sha) fail('runtime file SHA mismatch: ' + path);
          }
          console.log('PASS: repository, branch, approved baseline, R11 identity and all ' + Object.keys(app.files).length + ' authority-pinned runtime assets match.');
          NODE
